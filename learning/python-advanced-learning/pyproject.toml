[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-jinjie"
version = "0.0.0"
description = "「Python 进阶」本地子工程：四层 notebooks（语言→工程→接轨→AI）；路径 learning/python-advanced-learning。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

# notebooks/ 数据线、FastAPI、Streamlit 等练习（按需安装：`pip install -e ".[dev,learning]"`）
learning = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.10",
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
